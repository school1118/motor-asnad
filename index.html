<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اسناد موتور</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:#f0f2f5;margin:0;padding:12px;direction:rtl;-webkit-text-size-adjust:100%}
.login{position:fixed;inset:0;background:linear-gradient(135deg,#3498db,#2c3e50);display:flex;align-items:center;justify-content:center;z-index:99;padding:15px}
.login-box{background:#fff;padding:25px 20px;border-radius:14px;max-width:380px;width:100%;text-align:center}
.login-box h2{margin:0 0 8px;font-size:20px;color:#2c3e50}
.login-box p{color:#888;font-size:13px;margin:0 0 15px}
.login-box input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px;text-align:center;letter-spacing:2px;font-family:inherit}
.login-box button{width:100%;margin-top:12px;padding:12px;background:#3498db;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;font-family:inherit}
.err{color:#e74c3c;font-size:13px;margin-top:10px;min-height:18px}
.container{max-width:1200px;margin:auto}
h1{text-align:center;color:#2c3e50;font-size:20px;margin:8px 0 15px}
.bar{text-align:center;padding:8px;border-radius:8px;margin-bottom:12px;font-size:13px;font-weight:bold}
.on{background:#d4edda;color:#155724}
.off{background:#f8d7da;color:#721c24}
.card{background:#fff;border-radius:10px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.card h3{margin:0 0 12px;font-size:16px;color:#2c3e50}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:14px;font-family:inherit;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:#3498db}
input.dup{border-color:#e74c3c;background:#fdecea}
button{padding:10px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;margin:2px}
button:disabled{opacity:0.5;cursor:not-allowed}
.primary{background:#3498db;color:#fff}
.success{background:#27ae60;color:#fff}
.warning{background:#f39c12;color:#fff}
.danger{background:#e74c3c;color:#fff}
.gray{background:#7f8c8d;color:#fff}
.info{background:#16a085;color:#fff}
.purple{background:#8e44ad;color:#fff}
.sm{padding:6px 10px;font-size:12px}
.logout{position:fixed;top:10px;left:10px;background:#e74c3c;color:#fff;padding:8px 12px;font-size:12px;border-radius:8px;z-index:100}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{flex:1;min-width:140px}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;background:#fff;min-width:600px}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid #eee;font-size:13px}
th{background:#34495e;color:#fff;font-weight:normal;white-space:nowrap}
tr.dup-row{background:#fdecea}
td.dup-cell{color:#c0392b;font-weight:bold}
.badge{padding:3px 9px;border-radius:12px;font-size:11px;display:inline-block;white-space:nowrap}
.bp{background:#fff3cd;color:#856404}
.ba{background:#d4edda;color:#155724}
.bd{background:#d1ecf1;color:#0c5460}
.bu{background:#e2e3e5;color:#6c757d}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:12px}
.stat{background:#fff;padding:12px 8px;border-radius:10px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.num{font-size:22px;font-weight:bold;margin-bottom:3px}
.lbl{font-size:12px;color:#777}
.warn{color:#c0392b;font-size:12px;margin-top:6px;display:none}
.hint{font-size:11px;color:#888;margin-top:8px;line-height:1.8}
.hint code{background:#eef2f5;padding:2px 6px;border-radius:4px;color:#c0392b}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.file-status{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;margin-right:6px}
.fs-on{background:#d4edda;color:#155724}
.fs-off{background:#e2e3e5;color:#6c757d}

/* مودال */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:200;padding:15px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.modal h3{margin:0 0 15px;color:#2c3e50;font-size:17px}
.modal .field{margin-bottom:12px}
.modal .field label{display:block;font-size:12px;color:#555;margin-bottom:5px}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions button{flex:1;padding:11px;font-size:14px}

/* تب‌ها در مودال */
.tabs{display:flex;gap:5px;border-bottom:2px solid #eee;margin-bottom:15px}
.tab{padding:8px 14px;cursor:pointer;font-size:13px;color:#777;border-bottom:3px solid transparent;margin-bottom:-2px;background:none;border-radius:0}
.tab.active{color:#3498db;border-bottom-color:#3498db;font-weight:bold}

/* تاریخچه */
.history-list{max-height:400px;overflow-y:auto}
.history-item{background:#f8f9fa;border-radius:8px;padding:12px;margin-bottom:8px;border-right:4px solid #3498db;font-size:13px}
.history-item.create{border-right-color:#27ae60}
.history-item.update{border-right-color:#f39c12}
.history-item.status{border-right-color:#8e44ad}
.history-item .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:5px}
.history-item .action{font-weight:bold;color:#2c3e50;font-size:13px}
.history-item .date{color:#888;font-size:11px}
.history-item .changes{color:#555;font-size:12px;line-height:1.7}
.history-item .changes .old{color:#c0392b;text-decoration:line-through}
.history-item .changes .new{color:#27ae60;font-weight:bold}

/* چاپ */
.print-area{display:none}

@media (max-width:640px){
  body{padding:8px}
  h1{font-size:17px;margin:5px 0 10px}
  .card{padding:12px;margin-bottom:10px}
  .card h3{font-size:15px}
  .num{font-size:19px}
  .lbl{font-size:11px}
  .stat{padding:10px 5px}
  .logout{top:8px;left:8px;padding:7px 10px;font-size:11px}
  .grid{grid-template-columns:1fr}
  .tools button{flex:1;min-width:calc(50% - 8px)}
  .filters{flex-direction:column}
  .filters input,.filters select{min-width:100%}
  .modal{padding:15px;max-height:95vh}
  button{padding:11px 14px;font-size:14px}
  .sm{padding:8px 10px;font-size:12px}
  th,td{padding:8px 6px;font-size:12px}
  table{min-width:520px}
  .modal-actions{flex-direction:column}
}

@media (max-width:400px){
  .stat .num{font-size:17px}
  .stat .lbl{font-size:10px}
  h1{font-size:15px}
}

/* استایل چاپ */
@media print{
  body > *:not(.print-area){display:none !important}
  .print-area{display:block !important;padding:20px;font-family:Vazirmatn,Tahoma,sans-serif}
  .print-area h2{text-align:center;color:#2c3e50;margin-bottom:20px;border-bottom:3px double #333;padding-bottom:10px}
  .print-area table{width:100%;border:1px solid #333;margin-bottom:15px;min-width:auto}
  .print-area td{padding:12px;border:1px solid #999;font-size:14px}
  .print-area td:first-child{background:#f0f0f0;font-weight:bold;width:35%}
  .print-area .print-footer{margin-top:30px;text-align:center;font-size:12px;color:#666;border-top:1px dashed #999;padding-top:10px}
  .print-area .status-box{display:inline-block;padding:6px 16px;border-radius:20px;font-weight:bold}
</style>
</head>
<body>

<div class="login" id="loginScreen">
  <div class="login-box">
    <h2>ورود به سیستم</h2>
    <p>رمز عبور را وارد کنید</p>
    <input type="password" id="pass" placeholder="......" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">ورود</button>
    <div class="err" id="err"></div>
  </div>
</div>

<button class="logout" id="logoutBtn" style="display:none" onclick="doLogout()">خروج</button>

<div class="container" id="main" style="display:none">
  <h1>🏍️  مدیریت اسناد موتورسیکلت</h1>
  <div class="bar on" id="bar">آنلاین</div>

  <div class="stats">
    <div class="stat"><div class="num" id="s1" style="color:#3498db">0</div><div class="lbl">کل</div></div>
    <div class="stat"><div class="num" id="s2" style="color:#f39c12">0</div><div class="lbl">در حال انجام</div></div>
    <div class="stat"><div class="num" id="s3" style="color:#27ae60">0</div><div class="lbl">موجود</div></div>
    <div class="stat"><div class="num" id="s4" style="color:#0c5460">0</div><div class="lbl">تحویل</div></div>
    <div class="stat"><div class="num" id="s5" style="color:#6c757d">0</div><div class="lbl">نامشخص</div></div>
  </div>

  <div class="card">
    <h3>📊 اکسل</h3>
    <div class="tools">
      <button class="primary" onclick="document.getElementById('excelInput').click()">📥 ورود</button>
      <button class="success" onclick="exportExcel('all')">📤 خروجی همه</button>
      <button class="warning" onclick="exportExcel('filtered')">📤 خروجی فیلتر</button>
      <button class="gray" onclick="downloadTemplate()">📄 قالب</button>
      <input type="file" id="excelInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="importExcel(event)">
    </div>

    <div style="border-top:1px solid #eee;padding-top:12px;margin-top:6px">
      <div style="margin-bottom:8px;font-size:13px">
        <b>🔗 فایل اکسل مرجع:</b>
        <span class="file-status fs-off" id="fileStatus">وصل نیست</span>
      </div>
      <div class="tools">
        <button class="primary" id="linkFileBtn" onclick="linkExcelFile()">📎 اتصال</button>
        <button class="success" id="unlinkFileBtn" style="display:none" onclick="unlinkExcelFile()">🔓 لغو</button>
        <button class="gray" id="reloadFileBtn" style="display:none" onclick="reloadFromExcelFile()">🔄 خواندن مجدد</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>➕ ثبت سند جدید</h3>
    <div class="grid">
      <input type="text" id="cname" placeholder="نام مشتری *">
      <input type="text" id="bname" placeholder="نام موتور *">
      <input type="text" id="plate" placeholder="شماره پلاک *" oninput="checkDup()">
      <textarea id="notes" placeholder="توضیحات" rows="1"></textarea>
    </div>
    <div class="warn" id="dupWarn">⚠️ این پلاک قبلا ثبت شده</div>
    <div style="margin-top:10px">
      <button class="primary" onclick="addDoc()" style="width:100%">➕ ثبت</button>
    </div>
  </div>

  <div class="card">
    <div class="filters">
      <input type="text" id="search" placeholder="🔍 جستجو..." oninput="render()">
      <select id="fstat" onchange="render()">
        <option value="">همه وضعیت‌ها</option>
        <option>در حال انجام</option>
        <option>موجود</option>
        <option>تحویل شده</option>
        <option>مشخص نیست</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>نام مشتری</th><th>موتور</th><th>پلاک</th><th>وضعیت</th><th>تاریخ</th><th>عملیات</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ============ مودال ویرایش + تاریخچه ============ -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>✏️ ویرایش سند</h3>

    <div class="tabs">
      <button class="tab active" id="tabEdit" onclick="switchTab('edit')">✏️ ویرایش</button>
      <button class="tab" id="tabHistory" onclick="switchTab('history')">📜 تاریخچه</button>
    </div>

    <!-- تب ویرایش -->
    <div id="paneEdit">
      <input type="hidden" id="editId">
      <div class="field">
        <label>نام مشتری *</label>
        <input type="text" id="editCname">
      </div>
      <div class="field">
        <label>نام موتور *</label>
        <input type="text" id="editBname">
      </div>
      <div class="field">
        <label>شماره پلاک *</label>
        <input type="text" id="editPlate">
      </div>
      <div class="field">
        <label>وضعیت سند</label>
        <select id="editStatus">
          <option>در حال انجام</option>
          <option>موجود</option>
          <option>تحویل شده</option>
          <option>مشخص نیست</option>
        </select>
      </div>
      <div class="field">
        <label>توضیحات</label>
        <textarea id="editNotes" rows="2"></textarea>
      </div>
      <div class="modal-actions">
        <button class="gray" onclick="closeEditModal()">لغو</button>
        <button class="success" onclick="saveEdit()">💾 ذخیره</button>
      </div>
    </div>

    <!-- تب تاریخچه -->
    <div id="paneHistory" style="display:none">
      <div id="historyContent" class="history-list">
        <p style="text-align:center;color:#999;padding:20px">در حال بارگذاری...</p>
      </div>
      <div class="modal-actions">
        <button class="gray" onclick="closeEditModal()">بستن</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ ناحیه چاپ ============ -->
<div class="print-area" id="printArea"></div>

<script>
/* ============================================
   تنظیمات
   ============================================ */
var SUPABASE_URL = 'https://glzhxqtgfdwmvmpenbod.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_6A3Mb9Zk5or9O-gWDyt0UA_uVpsyUhy';
var APP_PASSWORD = 'moto1404';
/* ============================================ */

var VALID = ['در حال انجام','موجود','تحویل شده'];
var UNKNOWN = 'مشخص نیست';
var SESSION = 'moto_auth';

var sb = null;
var docs = [];
var online = navigator.onLine;
var logged = false;
var currentEditId = null;

var excelFileHandle = null;
var autoSaveEnabled = false;

/* ============ ورود / خروج ============ */
function doLogin() {
  var p = document.getElementById('pass').value;
  var e = document.getElementById('err');
  if (p === APP_PASSWORD) {
    sessionStorage.setItem(SESSION, '1');
    logged = true;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    document.getElementById('logoutBtn').style.display = 'block';
    init();
  } else {
    e.textContent = 'رمز اشتباه است';
    document.getElementById('pass').value = '';
  }
}

function doLogout() {
  sessionStorage.removeItem(SESSION);
  location.reload();
}

async function init() {
  try {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    await load();
    sb.channel('ch').on('postgres_changes', {event:'*', schema:'public', table:'documents'}, function(){ load(); }).subscribe();
  } catch(err) {
    console.error(err);
    alert('خطا در اتصال: ' + err.message);
  }
}

async function load() {
  var r = await sb.from('documents').select('*').order('created_at', {ascending:false});
  if (r.error) { console.error(r.error); alert('خطا: ' + r.error.message); return; }
  docs = r.data || [];
  render();
}

/* ============ ثبت تاریخچه ============ */
async function logHistory(documentId, action, oldData, newData) {
  try {
    var r = await sb.from('document_history').insert([{
      document_id: documentId,
      action: action,
      old_data: oldData || null,
      new_data: newData || null
    }]);
    if (r.error) console.warn('خطا در ثبت تاریخچه:', r.error.message);
  } catch(e) {
    console.warn('خطا در ثبت تاریخچه:', e);
  }
}

/* ============ وضعیت ============ */
function updateBar() {
  var b = document.getElementById('bar');
  online = navigator.onLine;
  b.className = 'bar ' + (online ? 'on' : 'off');
  b.textContent = online ? '🟢 آنلاین' : '🔴 آفلاین - فقط مشاهده';
  render();
}
window.addEventListener('online', updateBar);
window.addEventListener('offline', updateBar);

function jdate(iso) {
  try { return new Date(iso).toLocaleDateString('fa-IR'); } catch(e) { return '-'; }
}
function jdatetime(iso) {
  try {
    var d = new Date(iso);
    return d.toLocaleDateString('fa-IR') + ' - ' + d.toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'});
  } catch(e) { return '-'; }
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function isDup(plate, ex) {
  var p = String(plate || '').trim();
  if (!p) return false;
  for (var i=0; i<docs.length; i++) {
    if (docs[i].id !== ex && String(docs[i].plate_number).trim() === p) return true;
  }
  return false;
}

function checkDup() {
  var p = document.getElementById('plate').value.trim();
  var w = document.getElementById('dupWarn');
  var inp = document.getElementById('plate');
  if (p && isDup(p)) {
    inp.classList.add('dup');
    w.style.display = 'block';
  } else {
    inp.classList.remove('dup');
    w.style.display = 'none';
  }
}

/* ============ ثبت ============ */
async function addDoc() {
  if (!online) { alert('آفلاین - ثبت ممکن نیست'); return; }
  var cn = document.getElementById('cname').value.trim();
  var bn = document.getElementById('bname').value.trim();
  var pl = document.getElementById('plate').value.trim();
  var nt = document.getElementById('notes').value.trim();
  if (!cn || !bn || !pl) { alert('همه فیلدهای اجباری را پر کنید'); return; }
  if (isDup(pl) && !confirm('پلاک تکراری. ادامه؟')) return;

  var newDoc = {customer_name:cn, bike_name:bn, plate_number:pl, notes:nt, status:'در حال انجام'};
  var r = await sb.from('documents').insert([newDoc]).select().single();
  if (r.error) { alert('خطا: ' + r.error.message); return; }

  // ثبت تاریخچه
  if (r.data && r.data.id) {
    await logHistory(r.data.id, 'ثبت', null, newDoc);
  }

  document.getElementById('cname').value = '';
  document.getElementById('bname').value = '';
  document.getElementById('plate').value = '';
  document.getElementById('notes').value = '';
  checkDup();
  setTimeout(tryAutoSaveExcel, 800);
}

/* ============ تغییر وضعیت ============ */
async function changeStatus(id, ns) {
  if (!online) { alert('آفلاین - ممکن نیست'); return; }
  var d = null;
  for (var i=0; i<docs.length; i++) if (docs[i].id === id) d = docs[i];
  if (!d) return;
  var rules = {
    'در حال انجام': ['موجود'],
    'موجود': ['تحویل شده'],
    'تحویل شده': [],
    'مشخص نیست': ['در حال انجام','موجود']
  };
  if (!rules[d.status] || rules[d.status].indexOf(ns) === -1) { alert('تبدیل مجاز نیست'); return; }
  if (!confirm('تغییر به ' + ns + '؟')) return;

  var oldStatus = d.status;
  var r = await sb.from('documents').update({status:ns, updated_at:new Date().toISOString()}).eq('id', id);
  if (r.error) { alert('خطا: ' + r.error.message); return; }

  // تاریخچه
  await logHistory(id, 'تغییر وضعیت',
    {status: oldStatus},
    {status: ns}
  );

  setTimeout(tryAutoSaveExcel, 800);
}

/* ============ حذف ============ */
async function delDoc(id) {
  if (!online) { alert('آفلاین'); return; }
  if (!confirm('حذف شود؟')) return;

  var d = null;
  for (var i=0; i<docs.length; i++) if (docs[i].id === id) d = docs[i];

  var r = await sb.from('documents').delete().eq('id', id);
  if (r.error) alert('خطا: ' + r.error.message);
  else setTimeout(tryAutoSaveExcel, 800);
}

/* ============ ویرایش ============ */
function openEdit(id) {
  var d = null;
  for (var i=0; i<docs.length; i++) if (docs[i].id === id) d = docs[i];
  if (!d) return;
  if (!online) { alert('🔴 آفلاین - ویرایش ممکن نیست'); return; }

  currentEditId = d.id;
  document.getElementById('editId').value = d.id;
  document.getElementById('editCname').value = d.customer_name || '';
  document.getElementById('editBname').value = d.bike_name || '';
  document.getElementById('editPlate').value = d.plate_number || '';
  document.getElementById('editStatus').value = d.status || 'در حال انجام';
  document.getElementById('editNotes').value = d.notes || '';

  switchTab('edit');
  document.getElementById('editModal').classList.add('show');
  document.getElementById('editCname').focus();
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('show');
  currentEditId = null;
}

async function saveEdit() {
  if (!online) { alert('آفلاین'); return; }
  var id = document.getElementById('editId').value;
  var cn = document.getElementById('editCname').value.trim();
  var bn = document.getElementById('editBname').value.trim();
  var pl = document.getElementById('editPlate').value.trim();
  var st = document.getElementById('editStatus').value;
  var nt = document.getElementById('editNotes').value.trim();

  if (!cn || !bn || !pl) { alert('همه فیلدهای اجباری را پر کنید'); return; }
  if (VALID.indexOf(st) === -1) st = UNKNOWN;

  var dup = false;
  for (var i=0; i<docs.length; i++) {
    if (docs[i].id !== id && String(docs[i].plate_number).trim() === pl) { dup = true; break; }
  }
  if (dup && !confirm('⚠️ این پلاک در سند دیگری ثبت شده. ذخیره شود؟')) return;

  // اطلاعات قبلی برای تاریخچه
  var old = null;
  for (var j=0; j<docs.length; j++) if (docs[j].id === id) old = docs[j];

  var newData = {customer_name:cn, bike_name:bn, plate_number:pl, status:st, notes:nt};
  var r = await sb.from('documents').update(Object.assign({}, newData, {updated_at:new Date().toISOString()})).eq('id', id);
  if (r.error) { alert('خطا: ' + r.error.message); return; }

  // ثبت تغییرات در تاریخچه
  if (old) {
    var changes = {};
    var changed = false;
    if (old.customer_name !== cn) { changes.customer_name = {old: old.customer_name, new: cn}; changed = true; }
    if (old.bike_name !== bn) { changes.bike_name = {old: old.bike_name, new: bn}; changed = true; }
    if (old.plate_number !== pl) { changes.plate_number = {old: old.plate_number, new: pl}; changed = true; }
    if (old.status !== st) { changes.status = {old: old.status, new: st}; changed = true; }
    if ((old.notes || '') !== nt) { changes.notes = {old: old.notes || '', new: nt}; changed = true; }

    if (changed) {
      await logHistory(id, 'ویرایش', changes, null);
    }
  }

  closeEditModal();
  setTimeout(tryAutoSaveExcel, 800);
}

function switchTab(which) {
  var tabEdit = document.getElementById('tabEdit');
  var tabHistory = document.getElementById('tabHistory');
  var paneEdit = document.getElementById('paneEdit');
  var paneHistory = document.getElementById('paneHistory');

  if (which === 'edit') {
    tabEdit.classList.add('active');
    tabHistory.classList.remove('active');
    paneEdit.style.display = 'block';
    paneHistory.style.display = 'none';

    tabHistory.classList.add('active');
    paneEdit.style.display = 'none';
    paneHistory.style.display = 'block';
    loadHistory(currentEditId);

}

async function loadHistory(docId) {
  var container = document.getElementById('historyContent');
  container.innerHTML = '<p style="text-align:center;color:#999;padding:20px">در حال بارگذاری...</p>';

  var r = await sb.from('document_history')
    .select('*')
    .eq('document_id', docId)
    .order('created_at', {ascending:false});

  if (r.error) {
    container.innerHTML = '<p style="color:#c0392b;text-align:center;padding:20px">خطا: ' + esc(r.error.message) + '</p>';
    return;
  }

  var list = r.data || [];
  if (!list.length) {
    container.innerHTML = '<p style="text-align:center;color:#999;padding:20px">تاریخچه‌ای ثبت نشده است.</p>';
    return;
  }

  container.innerHTML = list.map(function(h) {
    var cls = 'history-item';
    var icon = '📝';
    if (h.action === 'ثبت') { cls += ' create'; icon = '➕'; }
    else if (h.action === 'تغییر وضعیت') { cls += ' status'; icon = '🔄'; }
    else if (h.action === 'ویرایش') { cls += ' update'; icon = '✏️'; }

    var changesHtml = '';
    if (h.action === 'ثبت' && h.new_data) {
      var nd = h.new_data;
      changesHtml = 'ثبت اولیه: ' + esc(nd.customer_name || '') + ' - ' + esc(nd.bike_name || '') + ' - پلاک ' + esc(nd.plate_number || '');
    } else if (h.action === 'تغییر وضعیت' && h.old_data && h.new_data) {
      changesHtml = 'وضعیت: <span class="old">' + esc(h.old_data.status || '') + '</span> ← <span class="new">' + esc(h.new_data.status || '') + '</span>';
    } else if (h.action === 'ویرایش' && h.old_data) {
      var labels = {
        customer_name: 'نام مشتری',
        bike_name: 'نام موتور',
        plate_number: 'شماره پلاک',
        status: 'وضعیت',
        notes: 'توضیحات'
      };
      var parts = [];
      for (var k in h.old_data) {
        var ch = h.old_data[k];
        parts.push(labels[k] + ': <span class="old">' + esc(ch.old || '(خالی)') + '</span> ← <span class="new">' + esc(ch.new || '(خالی)') + '</span>');
      }
      changesHtml = parts.join('<br>');
    }

    return '<div class="' + cls + '">' +
      '<div class="head">' +
        '<span class="action">' + icon + ' ' + esc(h.action) + '</span>' +
        '<span class="date">' + jdatetime(h.created_at) + '</span>' +
      '</div>' +
      (changesHtml ? '<div class="changes">' + changesHtml + '</div>' : '') +
    '</div>';
  }).join('');
}

  });
}

function downloadTemplate() {

function docsToRows(list) {
  return list.map(function(d, i) {
    return {
      'ردیف': i + 1,
      'نام مشتری': d.customer_name,
      'نام موتور': d.bike_name,
      'شماره پلاک': d.plate_number,
      'وضعیت سند': d.status,
      'تاریخ ثبت': jdate(d.created_at),
      'آخرین تغییر': jdate(d.updated_at),
      'توضیحات': d.notes || ''
    };
  });
}

function exportExcel(which) {
  var list = which === 'filtered' ? filtered() : docs;
  if (!list.length) { alert('لیستی برای خروجی وجود ندارد.'); return; }
  var rows = docsToRows(list);
  var ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:6},{wch:20},{wch:18},{wch:20},{wch:14},{wch:12},{wch:12},{wch:30}];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'اسناد');
  var name = which === 'filtered' ? 'اسناد-فیلترشده' : 'اسناد';
  XLSX.writeFile(wb, name + '-' + new Date().toISOString().slice(0,10) + '.xlsx');
}

function pick(obj, keys) {
  for (var i=0; i<keys.length; i++) {
    var k = keys[i];
    if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') return String(obj[k]);
  }
  var norm = function(s){ return String(s).replace(/[\s\u200c\u200f]/g,'').toLowerCase(); };
  var targets = keys.map(norm);
  for (var key in obj) {
    if (targets.indexOf(norm(key)) !== -1) return String(obj[key]);
  }
  return '';
}

async function importExcel(event) {
  if (!online) { alert('آفلاین - ورود اکسل ممکن نیست'); event.target.value = ''; return; }
  var file = event.target.files[0];
  if (!file) return;

  var reader = new FileReader();
  reader.onload = async function(e) {
    try {
      var data = new Uint8Array(e.target.result);
      var wb = XLSX.read(data, {type:'array'});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      if (!rows.length) { alert('فایل خالی است.'); return; }

      var toAdd = [], toUpdate = [], skipped = 0;
      var existingByPlate = {};
      docs.forEach(function(d) {
        var k = String(d.plate_number || '').trim();
        if (k) existingByPlate[k] = d;
      });
      var seenInFile = {};

      rows.forEach(function(r) {
        var customer_name = pick(r, ['نام مشتری','نام مشتري','مشتری','customer','name']).trim();
        var bike_name     = pick(r, ['نام موتور','موتور','bike','motor']).trim();
        var plate_number  = pick(r, ['شماره پلاک','پلاک','plate']).trim();
        var notes         = pick(r, ['توضیحات','note','notes','description']).trim();
        var rawStatus     = pick(r, ['وضعیت سند','وضعیت','status']).trim();

        if (!customer_name || !bike_name || !plate_number) { skipped++; return; }
        if (seenInFile[plate_number]) { skipped++; return; }
        seenInFile[plate_number] = true;

        var status = VALID.indexOf(rawStatus) !== -1 ? rawStatus : UNKNOWN;
        var ex = existingByPlate[plate_number];
        if (ex) {
          var diff = (ex.customer_name !== customer_name) ||
                     (ex.bike_name !== bike_name) ||
                     ((ex.notes || '') !== notes) ||
                     (ex.status !== status);
          if (diff) {
            toUpdate.push({id: ex.id, old: ex, neu: {customer_name:customer_name, bike_name:bike_name, notes:notes, status:status}});
          }
        } else {
          toAdd.push({customer_name:customer_name, bike_name:bike_name, plate_number:plate_number, notes:notes, status:status});
        }
      });

      if (!toAdd.length && !toUpdate.length) {
        alert('همه سطرها یکسان هستند.\n' + (skipped ? skipped + ' سطر ناقص نادیده گرفته شد.' : ''));
        return;
      }

      var msg = '📊 خلاصه:\n\n';
      if (toAdd.length) msg += '➕ ' + toAdd.length + ' سند جدید\n';
      if (toUpdate.length) msg += '🔄 ' + toUpdate.length + ' به‌روزرسانی\n';
      if (skipped) msg += '⏭️ ' + skipped + ' نادیده گرفته شد\n';
      msg += '\nادامه؟';
      if (!confirm(msg)) return;

      var okAdd = 0, okUpd = 0, errCount = 0;
      if (toAdd.length) {
        var rAdd = await sb.from('documents').insert(toAdd).select();
        if (rAdd.error) { alert('خطا: ' + rAdd.error.message); errCount++; }
        else {
          okAdd = toAdd.length;
          // ثبت تاریخچه برای هر سند جدید
          if (rAdd.data) {
            for (var k=0; k<rAdd.data.length; k++) {
              var nd = rAdd.data[k];
              await logHistory(nd.id, 'ثبت', null, {
                customer_name: nd.customer_name,
                bike_name: nd.bike_name,
                plate_number: nd.plate_number,
                status: nd.status
              });
            }
          }
        }
      }
      for (var i=0; i<toUpdate.length; i++) {
        var u = toUpdate[i];
        var upd = u.neu;
        upd.updated_at = new Date().toISOString();
        var rUpd = await sb.from('documents').update(upd).eq('id', u.id);
        if (rUpd.error) errCount++;
        else {
          okUpd++;
          // ثبت تاریخچه
          var changes = {};
          for (var f in u.neu) {
            if (u.old[f] !== u.neu[f]) {
              changes[f] = {old: u.old[f] || '', new: u.neu[f] || ''};
            }
          }
          if (Object.keys(changes).length) {
            await logHistory(u.id, 'ویرایش', changes, null);
          }
        }
      }
      var fm = '✅ انجام شد\n\n➕ ' + okAdd + ' جدید\n🔄 ' + okUpd + ' به‌روزرسانی';
      if (errCount) fm += '\n❌ ' + errCount + ' خطا';
      alert(fm);
      await load();
      setTimeout(tryAutoSaveExcel, 800);
    } catch (err) {
      console.error(err);
      alert('خطا: ' + err.message);
    } finally {
      event.target.value = '';
    }
  };
  reader.readAsArrayBuffer(file);
}

/* ============ File System Access ============ */
function isFSASupported() {
  return typeof window.showOpenFilePicker === 'function';
}

async function linkExcelFile() {
  if (!isFSASupported()) {
    alert('⚠️ مرورگر پشتیبانی نمی‌کند.\nلطفاً Chrome یا Edge استفاده کنید.');
    return;
  }
  if (!window.isSecureContext) {
    alert('⚠️ نیاز به HTTPS دارد.');
    return;
  }
  try {
    var handles = await window.showOpenFilePicker({
      types: [{description:'فایل اکسل', accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx'],'application/vnd.ms-excel':['.xls']}}],
      multiple: false
    });
    excelFileHandle = handles[0];
    autoSaveEnabled = true;
    await saveFileHandle(excelFileHandle);
    updateFileUI();
    if (confirm('✅ فایل وصل شد.\n\nآیا همین حالا از فایل بخوانیم؟')) {
      await reloadFromExcelFile();
    } else {
      alert('✅ فایل متصل شد.');
    }
  } catch (err) {
    if (err.name !== 'AbortError') {
      console.error(err);
      alert('خطا: ' + err.message);
    }
  }
}

function unlinkExcelFile() {
  excelFileHandle = null;
  autoSaveEnabled = false;
  deleteFileHandle();
  updateFileUI();
  alert('اتصال قطع شد.');
}

function updateFileUI() {
  var fs = document.getElementById('fileStatus');
  var linkBtn = document.getElementById('linkFileBtn');
  var unlinkBtn = document.getElementById('unlinkFileBtn');
  var reloadBtn = document.getElementById('reloadFileBtn');
  if (excelFileHandle) {
    fs.className = 'file-status fs-on';
    fs.textContent = '✅ ' + (excelFileHandle.name || 'متصل');
    linkBtn.style.display = 'none';
    unlinkBtn.style.display = '';
    reloadBtn.style.display = '';
  } else {
    fs.className = 'file-status fs-off';
    fs.textContent = 'وصل نیست';
    linkBtn.style.display = '';
    unlinkBtn.style.display = 'none';
    reloadBtn.style.display = 'none';
  }
}

async function tryAutoSaveExcel() {
  if (!excelFileHandle || !autoSaveEnabled) return;
  if (!isFSASupported()) return;
  try {
    var perm = await excelFileHandle.queryPermission({mode:'readwrite'});
    if (perm !== 'granted') perm = await excelFileHandle.requestPermission({mode:'readwrite'});
    if (perm !== 'granted') return;
    var rows = docsToRows(docs);
    var ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{wch:6},{wch:20},{wch:18},{wch:20},{wch:14},{wch:12},{wch:12},{wch:30}];
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'اسناد');
    var out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    var writable = await excelFileHandle.createWritable();
    await writable.write(out);
    await writable.close();
  } catch (err) { console.warn('خطا در ذخیره خودکار:', err); }
}

async function reloadFromExcelFile() {
  if (!excelFileHandle) { alert('ابتدا فایل را وصل کنید.'); return; }
  try {
    var perm = await excelFileHandle.queryPermission({mode:'read'});
    if (perm !== 'granted') perm = await excelFileHandle.requestPermission({mode:'read'});
    if (perm !== 'granted') return;
    var file = await excelFileHandle.getFile();
    var reader = new FileReader();
    reader.onload = async function(e) {
      try {
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, {type:'array'});
        var ws = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(ws, {defval:''});
        if (!rows.length) { alert('فایل خالی است.'); return; }

        var toAdd = [], toUpdate = [], skipped = 0;
        var existingByPlate = {};
        docs.forEach(function(d) {
          var k = String(d.plate_number || '').trim();
          if (k) existingByPlate[k] = d;
        });
        var seenInFile = {};

        rows.forEach(function(r) {
          var customer_name = pick(r, ['نام مشتری','نام مشتري','مشتری','customer','name']).trim();
          var bike_name     = pick(r, ['نام موتور','موتور','bike','motor']).trim();
          var plate_number  = pick(r, ['شماره پلاک','پلاک','plate']).trim();
          var notes         = pick(r, ['توضیحات','note','notes','description']).trim();
          var rawStatus     = pick(r, ['وضعیت سند','وضعیت','status']).trim();

          if (!customer_name || !bike_name || !plate_number) { skipped++; return; }
          if (seenInFile[plate_number]) { skipped++; return; }
          seenInFile[plate_number] = true;

          var status = VALID.indexOf(rawStatus) !== -1 ? rawStatus : UNKNOWN;
          var ex = existingByPlate[plate_number];
          if (ex) {
            var diff = (ex.customer_name !== customer_name) ||
                       (ex.bike_name !== bike_name) ||
                       ((ex.notes || '') !== notes) ||
                       (ex.status !== status);
            if (diff) toUpdate.push({id: ex.id, old: ex, neu: {customer_name:customer_name, bike_name:bike_name, notes:notes, status:status}});
          } else {
            toAdd.push({customer_name:customer_name, bike_name:bike_name, plate_number:plate_number, notes:notes, status:status});
          }
        });

        if (!toAdd.length && !toUpdate.length) { alert('همه سطرها یکسان.'); return; }

        var msg = '📊 خلاصه:\n\n';
        if (toAdd.length) msg += '➕ ' + toAdd.length + '\n';
        if (toUpdate.length) msg += '🔄 ' + toUpdate.length + '\n';
        if (skipped) msg += '⏭️ ' + skipped + '\n';
        msg += '\nادامه؟';
        if (!confirm(msg)) return;

        var okAdd = 0, okUpd = 0, errC = 0;
        if (toAdd.length) {
          var rA = await sb.from('documents').insert(toAdd).select();
          if (rA.error) { alert('خطا: ' + rA.error.message); errC++; }
          else {
            okAdd = toAdd.length;
            if (rA.data) {
              for (var kk=0; kk<rA.data.length; kk++) {
                var nd = rA.data[kk];
                await logHistory(nd.id, 'ثبت', null, nd);
              }
            }
          }
        }
        for (var i=0; i<toUpdate.length; i++) {
          var u = toUpdate[i];
          u.neu.updated_at = new Date().toISOString();
          var rU = await sb.from('documents').update(u.neu).eq('id', u.id);
          if (rU.error) errC++;
          else {
            okUpd++;
            var changes = {};
            for (var f in u.neu) {
              if (u.old[f] !== u.neu[f]) changes[f] = {old: u.old[f] || '', new: u.neu[f] || ''};
            }
            if (Object.keys(changes).length) await logHistory(u.id, 'ویرایش', changes, null);
          }
        }
        alert('✅ انجام شد\n➕ ' + okAdd + '\n🔄 ' + okUpd + (errC ? '\n❌ ' + errC : ''));
        await load();
      } catch (err) { alert('خطا: ' + err.message); }
    };
    reader.readAsArrayBuffer(file);
  } catch (err) { alert('خطا: ' + err.message); }
}

/* ============ IndexedDB ============ */
function openDB() {
  return new Promise(function(resolve, reject) {
    var req = indexedDB.open('moto_files', 1);
    req.onupgradeneeded = function(e) { e.target.result.createObjectStore('handles'); };
    req.onsuccess = function(e) { resolve(e.target.result); };
    req.onerror = function(e) { reject(e.target.error); };
  });
}
async function saveFileHandle(handle) {
  try {
    var db = await openDB();
    var tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(handle, 'excel');
  } catch(e) { console.warn(e); }
}
async function loadFileHandle() {
  try {
    var db = await openDB();
    var tx = db.transaction('handles', 'readonly');
    var req = tx.objectStore('handles').get('excel');
    return new Promise(function(resolve) {
      req.onsuccess = function() { resolve(req.result || null); };
      req.onerror = function() { resolve(null); };
    });
  } catch(e) { return null; }
}
async function deleteFileHandle() {
  try {
    var db = await openDB();
    var tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').delete('excel');
  } catch(e) { console.warn(e); }
}
async function tryRestoreFileHandle() {
  if (!isFSASupported()) return;
  var h = await loadFileHandle();
  if (h) {
    excelFileHandle = h;
    try {
      var perm = await h.queryPermission({mode:'readwrite'});
      if (perm === 'granted') autoSaveEnabled = true;
      updateFileUI();
    } catch(e) { updateFileUI(); }
  }
}

/* ============ شروع ============ */
updateBar();
if (sessionStorage.getItem(SESSION) === '1') {
  logged = true;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  document.getElementById('logoutBtn').style.display = 'block';
  init().then(function() { tryRestoreFileHandle(); });
}
